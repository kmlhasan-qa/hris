name: Playwright Tests + Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Playwright tests
        run: npx playwright test --reporter=json > playwright-results.json
        continue-on-error: true

      - name: Parse test results
        id: stats
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('playwright-results.json','utf8'));

          let passed = 0;
          let failed = 0;

          for (const suite of (data.suites || [])) {
            for (const spec of (suite.specs || [])) {
              for (const test of (spec.tests || [])) {
                const status = test.results?.[0]?.status;
                if (status === 'passed') passed++;
                if (status === 'failed') failed++;
              }
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `PASSED=${passed}\nFAILED=${failed}\n`);
          "

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Notify Teams
        if: always()
        env:
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASSED: ${{ steps.stats.outputs.PASSED }}
          FAILED: ${{ steps.stats.outputs.FAILED }}
        run: |
          jq -n \
            --arg status "$STATUS" \
            --arg branch "$BRANCH" \
            --arg run "$RUN_NUMBER" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg url "$RUN_URL" '
            {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Playwright Test Report",
              "themeColor": "0076D7",
              "title": "Playwright Test Completed",
              "sections": [
                {
                  "activityTitle": "Playwright test results",
                  "facts": [
                    { "name": "Status", "value": $status },
                    { "name": "Branch", "value": $branch },
                    { "name": "Run Number", "value": $run },
                    { "name": "Passed", "value": $passed },
                    { "name": "Failed", "value": $failed }
                  ]
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "Open GitHub Run (Report + Artifacts)",
                  "targets": [
                    {
                      "os": "default",
                      "uri": $url
                    }
                  ]
                }
              ]
            }
            ' | curl -H "Content-Type: application/json" -d @- "${{ secrets.TEAMS_WEBHOOK_URL }}"