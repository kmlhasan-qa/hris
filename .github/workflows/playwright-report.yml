name: Playwright Tests + Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Parse test results
        id: stats
        if: always()
        shell: bash
        run: |
          PASSED=0
          FAILED=0
          SKIPPED=0

          if [ -f playwright-report.json ]; then
            PASSED=$(jq '[.. | objects | select(.status? == "passed")] | length' playwright-report.json)
            FAILED=$(jq '[.. | objects | select(.status? == "failed")] | length' playwright-report.json)
            SKIPPED=$(jq '[.. | objects | select(.status? == "skipped")] | length' playwright-report.json)
          fi

          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT
          echo "SKIPPED=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Upload report artifact
        id: upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Notify Teams
        if: always()
        env:
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PASSED: ${{ steps.stats.outputs.PASSED }}
          FAILED: ${{ steps.stats.outputs.FAILED }}
          SKIPPED: ${{ steps.stats.outputs.SKIPPED }}
        shell: bash
        run: |
          ARTIFACT_URL="${ARTIFACT_URL:-$RUN_URL}"

          jq -n \
            --arg status "$STATUS" \
            --arg branch "$BRANCH" \
            --arg run "$RUN_NUMBER" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg skipped "$SKIPPED" \
            --arg url "$RUN_URL" \
            --arg artifact "$ARTIFACT_URL" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Playwright Test Report",
              "themeColor": (if $status == "success" then "2ECC71" else "E74C3C" end),
              "title": ("Playwright Test Completed - " + $status),
              "sections": [
                {
                  "activityTitle": "Talentra API staging results",
                  "facts": [
                    { "name": "Status", "value": $status },
                    { "name": "Branch", "value": $branch },
                    { "name": "Run Number", "value": $run },
                    { "name": "Passed", "value": $passed },
                    { "name": "Failed", "value": $failed },
                    { "name": "Skipped", "value": $skipped },
                    { "name": "Report", "value": ("[Download Playwright HTML report (.zip)](" + $artifact + ")") }
                  ]
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "View on GitHub",
                  "targets": [
                    {
                      "os": "default",
                      "uri": $url
                    }
                  ]
                },
                {
                  "@type": "OpenUri",
                  "name": "Download Report",
                  "targets": [
                    {
                      "os": "default",
                      "uri": $artifact
                    }
                  ]
                }
              ]
            }' | curl \
              -H "Content-Type: application/json" \
              -d @- \
              "${{ secrets.TEAMS_WEBHOOK_URL }}"
