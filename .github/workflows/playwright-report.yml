name: Playwright Tests + Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        continue-on-error: true

      - name: Parse test results
        id: stats
        if: always()
        run: |
          node << 'EOF'
          const fs = require('fs');

          let passed = 0;
          let failed = 0;
          let skipped = 0;

          try {
            const report = JSON.parse(fs.readFileSync('playwright-report.json', 'utf8'));

            function walkSuites(suites = []) {
              for (const suite of suites) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    for (const result of test.results || []) {
                      if (result.status === 'passed') passed++;
                      else if (result.status === 'failed') failed++;
                      else if (result.status === 'skipped') skipped++;
                    }
                  }
                }

                walkSuites(suite.suites || []);
              }
            }

            walkSuites(report.suites || []);
          } catch (e) {
            console.log('Could not parse playwright-report.json:', e.message);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `PASSED=${passed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `FAILED=${failed}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `SKIPPED=${skipped}\n`);
          EOF

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Notify Teams
        if: always()
        env:
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASSED: ${{ steps.stats.outputs.PASSED }}
          FAILED: ${{ steps.stats.outputs.FAILED }}
          SKIPPED: ${{ steps.stats.outputs.SKIPPED }}
        run: |
          jq -n \
            --arg status "$STATUS" \
            --arg branch "$BRANCH" \
            --arg run "$RUN_NUMBER" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg skipped "$SKIPPED" \
            --arg url "$RUN_URL" \
            '{
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Playwright Test Report",
              "themeColor": (if $status == "success" then "2ECC71" else "E74C3C" end),
              "title": "Playwright Test Completed",
              "sections": [
                {
                  "activityTitle": "Playwright test results",
                  "facts": [
                    { "name": "Status", "value": $status },
                    { "name": "Branch", "value": $branch },
                    { "name": "Run Number", "value": $run },
                    { "name": "Passed", "value": $passed },
                    { "name": "Failed", "value": $failed },
                    { "name": "Skipped", "value": $skipped }
                  ]
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "Open GitHub Run (Artifacts + Report)",
                  "targets": [
                    {
                      "os": "default",
                      "uri": $url
                    }
                  ]
                }
              ]
            }' | curl \
              -H "Content-Type: application/json" \
              -d @- \
              "${{ secrets.TEAMS_WEBHOOK_URL }}"