name: Playwright Tests + Report

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ----------------------------
      # Run Playwright tests
      # ----------------------------
      - name: Run Playwright tests
        run: npx playwright test --reporter=json > playwright-report.json
        continue-on-error: true

      # ----------------------------
      # Parse results safely
      # ----------------------------
      - name: Parse test results
        id: stats
        run: |
          node << 'EOF' > result.txt
          const fs = require('fs');

          const report = JSON.parse(fs.readFileSync('playwright-report.json','utf8'));
          const stats = report.stats || {};

          const passed = stats.expected || 0;
          const failed = stats.unexpected || 0;
          const skipped = stats.skipped || 0;

          console.log(passed);
          console.log(failed);
          console.log(skipped);
          EOF

          PASSED=$(sed -n '1p' result.txt)
          FAILED=$(sed -n '2p' result.txt)
          SKIPPED=$(sed -n '3p' result.txt)

          echo "PASSED=$PASSED" >> $GITHUB_OUTPUT
          echo "FAILED=$FAILED" >> $GITHUB_OUTPUT
          echo "SKIPPED=$SKIPPED" >> $GITHUB_OUTPUT

      # ----------------------------
      # Upload HTML report artifact
      # ----------------------------
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      # ----------------------------
      # Notify Teams
      # ----------------------------
      - name: Notify Teams
        if: always()
        env:
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PASSED: ${{ steps.stats.outputs.PASSED }}
          FAILED: ${{ steps.stats.outputs.FAILED }}
          SKIPPED: ${{ steps.stats.outputs.SKIPPED }}
        run: |
          jq -n \
            --arg status "$STATUS" \
            --arg branch "$BRANCH" \
            --arg run "$RUN_NUMBER" \
            --arg passed "$PASSED" \
            --arg failed "$FAILED" \
            --arg skipped "$SKIPPED" \
            --arg url "$RUN_URL" '
            {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              "summary": "Playwright Test Report",
              "themeColor": ($status == "success" ? "2ECC71" : "E74C3C"),
              "title": "Playwright Test Completed",
              "sections": [
                {
                  "activityTitle": "Playwright test results",
                  "facts": [
                    { "name": "Status", "value": $status },
                    { "name": "Branch", "value": $branch },
                    { "name": "Run Number", "value": $run },
                    { "name": "Passed", "value": $passed },
                    { "name": "Failed", "value": $failed },
                    { "name": "Skipped", "value": $skipped }
                  ]
                }
              ],
              "potentialAction": [
                {
                  "@type": "OpenUri",
                  "name": "Open GitHub Run (Report + Artifacts)",
                  "targets": [
                    {
                      "os": "default",
                      "uri": $url
                    }
                  ]
                }
              ]
            }
            ' | curl -H "Content-Type: application/json" -d @- "${{ secrets.TEAMS_WEBHOOK_URL }}"